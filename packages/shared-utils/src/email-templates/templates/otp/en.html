{{> header}}
<h1 style="margin: 0 0 12px 0; font-size: 22px; color: #18181b">{{heading}}</h1>
<p style="margin: 0 0 20px 0">{{intro}}</p>
<div style="background-color: #f4f4f5; border-radius: 8px; padding: 18px; text-align: center; margin: 0 0 20px 0">
  <span style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 30px; letter-spacing: 8px; color: #18181b; font-weight: 700">{{code}}</span>
</div>
<p style="margin: 0; font-size: 13px; color: #71717a">This code expires in {{expiresInMinutes}} minutes. If you didn't request it, you can safely ignore this email.</p>
{{> footer}}

{{> header}}
<h1 style="margin: 0 0 12px 0; font-size: 22px; color: #18181b">Hola, {{name}}</h1>
<p style="margin: 0 0 16px 0">Tu cuenta está verificada y lista. Te hemos añadido <strong>{{bonusCredits}} créditos gratis</strong> para que empieces a chatear ahora mismo.</p>
<p style="margin: 0 0 24px 0">
  <a href="{{appUrl}}" style="display: inline-block; background-color: #18181b; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600">Abrir {{appName}}</a>
</p>
<p style="margin: 0; font-size: 13px; color: #71717a">¿Preguntas? Responde a este correo.</p>
{{> footer}}
